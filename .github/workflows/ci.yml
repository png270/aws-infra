name: Terraform security checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.15.9"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize root module without backend
        working-directory: environments/dev
        run: terraform init -backend=false

      - name: Validate root module
        working-directory: environments/dev
        run: terraform validate

      - name: Initialize EC2 module tests
        working-directory: modules/ec2
        run: terraform init -backend=false

      - name: Test EC2 module
        working-directory: modules/ec2
        run: terraform test

      - name: Initialize S3 module tests
        working-directory: modules/s3
        run: terraform init -backend=false

      - name: Test S3 module
        working-directory: modules/s3
        run: terraform test

  tflint:
    name: Terraform lint baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Initialize TFLint
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --minimum-failure-severity=error

  checkov:
    name: Checkov baseline report
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Checkov
        run: pipx install checkov==3.3.8

      - name: Run Checkov baseline scan
        run: |
          checkov \
            --directory . \
            --framework terraform \
            --compact \
            --soft-fail

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out complete history
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          